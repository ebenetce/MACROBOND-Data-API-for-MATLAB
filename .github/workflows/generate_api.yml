name: Generate Macrobond API

on:
  workflow_dispatch:
  schedule:
    # This cron expression schedules the workflow to run at 00:00 on the first day of every month
    - cron: '0 0 1 * *'

env:
  PACKAGE_NAME: macrobond
  OPENAPI_SPEC: https://api.macrobondfinancial.com/swagger/v1/swagger.json

jobs:
  process-yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: 'current-repo'      
          ref: autogeneratedAPI # Checkout the autogeneratedAPI branch

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: 'mathworks-ref-arch/matlab-openapi-generator'      
          path: 'external-repo'
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24 # Specify the Node.js version you want to use

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Build MATLAB OpenAPI generator
        run: |
          cd external-repo/Software/Java
          mvn -q clean package
          echo "OPENAPI_GENERATOR_VERSION=$(mvn -q help:evaluate -Dexpression=openapi-generator-version -DforceStdout)" >> "$GITHUB_ENV"

      - name: Generate API
        run: |
          cd external-repo/Software
          GENERATOR_JAR="$(find MATLAB/lib/jar -maxdepth 1 -name 'MATLAB-openapi-generator-*.jar' ! -name '*-tests.jar' -print -quit)"
          test -n "$GENERATOR_JAR"
          npx @openapitools/openapi-generator-cli version-manager set "$OPENAPI_GENERATOR_VERSION"
          npx @openapitools/openapi-generator-cli --custom-generator "$GENERATOR_JAR" generate -g matlab-client -i "${{ env.OPENAPI_SPEC }}" -o "${{ env.PACKAGE_NAME }}" --package-name "${{ env.PACKAGE_NAME }}" -p AddOAuth=auth

      - name: Configure Git
        run: |    
          cp -r external-repo/Software/${{ env.PACKAGE_NAME }} current-repo/tbx/
          cd current-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push changes
        run: |
          cd current-repo
          git add .
          # Check if there are any changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Update generated MATLAB API"
            git push origin autogeneratedAPI
          fi          
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
